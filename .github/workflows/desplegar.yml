# Despliegue continuo: cada push a `main` compila, verifica y publica.
#
# El sitio es estático, así que "desplegar" es dejar archivos en el VPS. Se
# suben a una carpeta nueva por versión (`releases/<fecha>-<sha>`) y recién
# cuando terminó de subir todo se mueve el enlace `current`, que es lo que mira
# nginx. El cambio de versión es entonces un rename(2): o se ve la anterior o
# se ve la nueva, nunca media subida a medio camino. Y volver atrás es mover el
# enlace otra vez, sin compilar nada.
#
# SECRETOS que hay que cargar en Settings → Secrets and variables → Actions:
#
#   VPS_HOST      IP o dominio del VPS.
#   VPS_USUARIO   Usuario de despliegue (deploy).
#   VPS_RUTA      Carpeta de la app, ej. /home/deploy/apps/nutrioffice-landing
#   VPS_SSH_KEY   Clave PRIVADA de despliegue, entera (ver el README).
#   VPS_HOST_KEY  La línea de known_hosts del VPS: `ssh-keyscan -H TU_HOST`.
#   VPS_PUERTO    Puerto SSH del VPS. Si falta, se usa el 2222.
#
# Y como VARIABLE (no secreto), opcional:
#   URL_SITIO     https://nutrioffice.com.ar — si está, se comprueba al final.
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos despliegues pisándose dejarían el enlace apuntando a cualquier cosa.
# `cancel-in-progress: false` para no cortar uno a mitad de la subida: se
# encolan y el último queda vigente.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    name: Compilar y publicar
    runs-on: ubuntu-latest
    environment: produccion

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # Si esto falla, no se sube nada: el sitio que está publicado sigue
      # intacto. Es la razón de verificar ANTES de tocar el servidor.
      - name: Verificar el sitio compilado
        run: npm run verificar

      - name: Preparar el acceso SSH
        env:
          CLAVE_PRIVADA: ${{ secrets.VPS_SSH_KEY }}
          CLAVE_DEL_HOST: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CLAVE_PRIVADA" > ~/.ssh/despliegue
          chmod 600 ~/.ssh/despliegue
          # El known_hosts va de un secreto y NO de un ssh-keyscan en caliente:
          # escanear en cada corrida es confiar en quien conteste en ese
          # momento, que es justo lo que la verificación evita.
          printf '%s\n' "$CLAVE_DEL_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Subir la versión nueva y activarla
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USUARIO }}
          RUTA: ${{ secrets.VPS_RUTA }}
          PUERTO: ${{ secrets.VPS_PUERTO || '2222' }}
        run: |
          set -euo pipefail

          SSH="ssh -i $HOME/.ssh/despliegue -p $PUERTO -o IdentitiesOnly=yes"
          VERSION="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          DESTINO="$RUTA/releases/$VERSION"

          echo "Versión: $VERSION"

          $SSH "$USUARIO@$HOST" "mkdir -p '$DESTINO'"
          rsync -az --delete -e "$SSH" dist/ "$USUARIO@$HOST:$DESTINO/"

          # `ln -sfn` deja el enlace nuevo al lado y `mv -T` lo pone en su lugar
          # de un solo golpe. Un `ln -sfn` directo sobre `current` no es atómico
          # cuando el destino ya existe.
          $SSH "$USUARIO@$HOST" "
            set -e
            ln -sfn '$DESTINO' '$RUTA/current.nuevo'
            mv -Tf '$RUTA/current.nuevo' '$RUTA/current'
            ls -1dt '$RUTA'/releases/*/ | tail -n +6 | xargs -r rm -rf
          "

          echo "Publicada. Para volver atrás:"
          echo "  ssh -p $PUERTO $USUARIO@$HOST \"ln -sfn $RUTA/releases/<anterior> $RUTA/current.nuevo && mv -Tf $RUTA/current.nuevo $RUTA/current\""

      - name: Comprobar que el sitio responde
        if: vars.URL_SITIO != ''
        run: |
          set -euo pipefail
          # -f para que un 4xx o 5xx corte el paso con error.
          codigo=$(curl -fsS -o /dev/null -w '%{http_code}' "${{ vars.URL_SITIO }}")
          echo "El sitio respondió $codigo"
